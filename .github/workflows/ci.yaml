name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]

env:
  NODE_VERSION: "26"
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/frontend

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: ESLint
        run: npm run lint

      - name: Prettier formatting check
        run: |
          npx prettier --check \
            "src/**/*.{ts,tsx,js,jsx}" \
            "*.{json,md,css}"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Vite build
        run: npm run build

  docker:
    name: Docker
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve image tags
        id: tags
        # Tagging strategy:
        #   - Push to main:       main-<short-sha> + latest   e.g. main-a1b2c3d, latest
        #   - Git tags (v*.*.*):  semver + latest             e.g. v1.2.3, latest
        #   - PR into main:       main-<short-sha>            e.g. main-a1b2c3d
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tags=${{ env.GHCR_IMAGE }}:${GITHUB_REF_NAME},${{ env.GHCR_IMAGE }}:latest" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            echo "tags=${{ env.GHCR_IMAGE }}:main-${SHORT_SHA},${{ env.GHCR_IMAGE }}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${{ env.GHCR_IMAGE }}:main-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
