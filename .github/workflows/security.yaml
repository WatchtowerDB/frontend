name: Security

on:
  push: # every branch, every push
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC

env:
  NODE_VERSION: "26"

permissions:
  contents: read

jobs:
  sca:
    name: NodeSecure SCA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: NodeSecure/ci-action@177c57fe32c75cafabe87f6e4515d277cc37ae6c # 1.4.1
        with:
          strategy: npm
          vulnerabilities: medium
          # warnings: error would fail on suspicious patterns too. It is REALLY noisy...
          warnings: |
            '{
              "obfuscated-code": "error",
              "encoded-literal": "off",
              "ast-error": "off",
              "unsafe-regex": "off",
              "suspicious-literal": "off",
              "unsafe-import": "off",
              "unsafe-assign": "off",
              "unsafe-stmt": "off"
            }'
          reporters: console

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - run: npm ci

      - run: npm audit --audit-level=moderate

  sast:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.164.0

    # Skip any PR created by dependabot to avoid permission issues
    if: (github.actor != 'dependabot[bot]')

    steps:
      - uses: actions/checkout@v6

      - run: semgrep scan --config p/default --error
